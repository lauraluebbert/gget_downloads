name: Weekly BigQuery downloads update

on:
  schedule:
    # Runs every Sunday at 23:55 UTC
    - cron: "55 23 * * 0"
  workflow_dispatch:
    inputs:
      initial_fetch:
        description: 'Run initial historical fetch (from 2022-02-22)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  id-token: write  # Required for Workload Identity Federation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Fetch download stats from BigQuery
        run: |
          if [ "${{ github.event.inputs.initial_fetch }}" == "true" ]; then
            echo "Running initial historical fetch..."
            python scripts/fetch_bigquery_stats.py --initial
          else
            echo "Running weekly incremental update..."
            python scripts/fetch_bigquery_stats.py --days 10
          fi

      - name: Generate plots
        run: python scripts/generate_plots.py

      - name: Commit updated data + plots (if changed)
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A data plots

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update gget downloads data + plots"

          # Keep branch up-to-date (handles concurrent updates) + retry push
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."
            git pull --rebase origin main || true
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "Push failed after retries."
          exit 1
